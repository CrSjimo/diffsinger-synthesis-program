name: Initialize vcpkg
description: Install manifest dependencies with an optional binary cache

inputs:
  ref:
    description: vcpkg commit
    required: true
  use_cache:
    description: Restore and save vcpkg binary caches
    default: 'true'

runs:
  using: composite
  steps:
    - name: Prepare binary cache
      if: inputs.use_cache == 'true'
      shell: pwsh
      run: |
        $cachePath = Join-Path $env:RUNNER_TEMP 'dssp-vcpkg-archives'
        New-Item -ItemType Directory -Path $cachePath -Force | Out-Null
        "VCPKG_DEFAULT_BINARY_CACHE=$cachePath" >> $env:GITHUB_ENV

    - name: Restore binary cache
      if: inputs.use_cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: dssp-${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ inputs.ref }}-${{ github.sha }}
        restore-keys: |
          dssp-${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ inputs.ref }}-

    - name: Install vcpkg dependencies
      shell: pwsh
      env:
        VCPKG_COMMIT: ${{ inputs.ref }}
        USE_CACHE: ${{ inputs.use_cache }}
        VCPKG_KEEP_ENV_VARS: MACOSX_DEPLOYMENT_TARGET;CC;CXX
      run: |
        $ErrorActionPreference = 'Stop'
        $vcpkgRoot = Join-Path $env:RUNNER_TEMP 'dssp-vcpkg'
        git clone https://github.com/microsoft/vcpkg.git $vcpkgRoot
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg clone failed' }
        git -C $vcpkgRoot checkout $env:VCPKG_COMMIT
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg checkout failed' }
        if ($IsWindows) {
          & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
        } else {
          & sh (Join-Path $vcpkgRoot 'bootstrap-vcpkg.sh') -disableMetrics
        }
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
        $env:VCPKG_ROOT = $vcpkgRoot
        "VCPKG_ROOT=$vcpkgRoot" >> $env:GITHUB_ENV
        "VCPKG_ROOT_DIR=$vcpkgRoot" >> $env:GITHUB_ENV
        if ($env:USE_CACHE -ne 'true') {
          $env:VCPKG_BINARY_SOURCES = 'clear'
          'VCPKG_BINARY_SOURCES=clear' >> $env:GITHUB_ENV
        }
        $arguments = @(
          'install'
          "--x-manifest-root=$env:GITHUB_WORKSPACE/scripts/vcpkg-manifest"
          "--x-install-root=$vcpkgRoot/installed"
        )
        & (Join-Path $vcpkgRoot ($IsWindows ? 'vcpkg.exe' : 'vcpkg')) @arguments
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg installation failed' }

    - name: Save binary cache
      if: inputs.use_cache == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: dssp-${{ runner.os }}-${{ runner.arch }}-vcpkg-${{ inputs.ref }}-${{ github.sha }}
