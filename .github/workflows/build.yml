name: Build

on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      build_type:
        required: true
        type: string
      version_identifier:
        type: string
        default: ''
      use_cache:
        type: boolean
        default: true
      use_ccache:
        type: boolean
        default: false
    outputs:
      semver:
        value: ${{ jobs.Prepare.outputs.semver }}
      tag:
        value: ${{ jobs.Prepare.outputs.tag }}
      application_name:
        value: ${{ jobs.Prepare.outputs.application_name }}

defaults:
  run:
    shell: pwsh

jobs:
  Prepare:
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
      tag: ${{ steps.version.outputs.tag }}
      application_name: ${{ steps.version.outputs.application_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
      - name: Prepare build version
        id: version
        uses: actions/github-script@v7
        env:
          BUILD_TYPE: ${{ inputs.build_type }}
          VERSION_IDENTIFIER: ${{ inputs.version_identifier }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        with:
          script: |
            await require('./.github/scripts/nightly.cjs').prepare({github, context, core});

  Build:
    needs: Prepare
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            platform: Windows
            arch: amd64
          - os: macos-15
            platform: macOS
            arch: arm64
          # - os: ubuntu-24.04
          #   platform: Linux
          #   arch: amd64
    runs-on: ${{ matrix.os }}
    env:
      VCPKG_REF: 39344dff01c5a5a0134caf2624cdd492f05d30ea
      VCPKG_DISABLE_METRICS: '1'
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      BUILD_DIR: ${{ github.workspace }}/build/build
      INSTALL_DIR: ${{ github.workspace }}/build/install
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      APPLICATION_SEMVER: ${{ needs.Prepare.outputs.semver }}
      APPLICATION_NAME: ${{ needs.Prepare.outputs.application_name }}
      ARTIFACT_PLATFORM: ${{ matrix.platform }}
      ARTIFACT_ARCH: ${{ matrix.arch }}
      USE_CCACHE: ${{ inputs.build_type != 'nightly' && inputs.use_cache && inputs.use_ccache }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          submodules: recursive

      - name: Initialize build environment
        uses: ./.github/actions/initialize-build-environment

      - name: Initialize vcpkg
        uses: ./.github/actions/initialize-vcpkg
        with:
          ref: ${{ env.VCPKG_REF }}
          use_cache: ${{ inputs.build_type != 'nightly' && inputs.use_cache }}

      - name: Restore CCache cache
        if: inputs.build_type != 'nightly' && inputs.use_cache && inputs.use_ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ inputs.source_sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Build and install
        run: |
          $expectedArch = $env:ARTIFACT_ARCH -eq 'amd64' ? 'X64' : 'ARM64'
          if ($env:RUNNER_ARCH -ne $expectedArch) {
            throw "Unexpected runner architecture: $env:RUNNER_ARCH"
          }
          & ./scripts/ci/Build.ps1 `
            -VcpkgRootDir $env:VCPKG_ROOT_DIR `
            -BuildDir $env:BUILD_DIR `
            -InstallDir $env:INSTALL_DIR `
            -Semver $env:APPLICATION_SEMVER `
            -CCache:($env:USE_CCACHE -eq 'true')

      - name: Save CCache cache
        if: inputs.build_type != 'nightly' && inputs.use_cache && inputs.use_ccache
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-ccache-${{ inputs.source_sha }}

      - name: Create portable ZIP
        run: |
          $fileBase = "$($env:APPLICATION_NAME)_$($env:APPLICATION_SEMVER -replace '[.\-+]', '_')_$($env:ARTIFACT_PLATFORM)_$($env:ARTIFACT_ARCH)_portable"
          $archive = & ./scripts/ci/Create-Portable.ps1 `
            -InstallDir $env:INSTALL_DIR `
            -ApplicationName $env:APPLICATION_NAME `
            -ArchivePath "$fileBase.zip"
          "ARTIFACT_NAME=$fileBase" >> $env:GITHUB_ENV
          "PORTABLE_PATH=$archive" >> $env:GITHUB_ENV

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.PORTABLE_PATH }}
          if-no-files-found: error
          overwrite: true
          compression-level: 0
